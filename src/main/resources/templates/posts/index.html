<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Acebook</title>

    <link rel="stylesheet" href="/main.css"/>
</head>

<body>

<!-- Navigation bar -->
<nav class="navbar">

    <div class="navbar-content">

        <div class="logo">
            Acebook
        </div>

        <div class="navigation-links">

            <a href="/posts">Home</a>
            <a href="/profile">Profile</a>
            <a href="/friends" id="friends_button">Friends</a>

            <div sec:authorize="isAuthenticated()" class="user-info" id="greeting">
                <span>Signed in as</span>
                <strong sec:authentication="principal.attributes['email']"></strong>
            </div>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">
                    Log out
                </button>
            </form>

        </div>

    </div>

</nav>


<!-- Main content -->
<main class="main-container">

    <h1>Posts</h1>


    <!-- Create post -->
    <section class="create-post card">

        <h2>Create a post</h2>

        <form th:action="@{/posts}"
              th:object="${post}"
              method="post"
              enctype="multipart/form-data">

            <!-- Post content -->
            <div class="form-group">

                <label for="content">
                    What's on your mind?
                </label>

                <textarea
                        id="content"
                        th:field="*{content}"
                        placeholder="Write something..."
                        required>
                </textarea>

            </div>


            <!-- Image upload -->
            <div class="form-group">

                <label for="image">
                    Add a photo
                </label>

                <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"/>

            </div>


            <!-- Music search -->
            <div class="form-group">

                <label for="songSearch">
                    Add a song
                </label>

                <input
                        type="text"
                        id="songSearch"
                        placeholder="Search for a song..."/>

                <button
                        type="button"
                        id="searchSongButton"
                        class="button button-secondary">
                    Search
                </button>

            </div>


            <!-- Song search results -->
            <div id="songResults"></div>


            <!-- Hidden song information -->
            <input
                    type="hidden"
                    th:field="*{songTitle}"
                    id="songTitle"/>

            <input
                    type="hidden"
                    th:field="*{songArtist}"
                    id="songArtist"/>

            <input
                    type="hidden"
                    th:field="*{songImageUrl}"
                    id="songImageUrl"/>

            <input
                    type="hidden"
                    th:field="*{songPreviewUrl}"
                    id="songPreviewUrl"/>


            <!-- Selected song -->
            <div id="selectedSong"></div>


            <!-- Buttons -->
            <div class="form-buttons">

                <input
                        type="reset"
                        value="Reset"
                        class="button button-secondary"/>

                <input
                        type="submit"
                        value="Post"
                        class="button button-primary"/>

            </div>

        </form>

    </section>


    <!-- Posts -->
    <section class="posts-section">

        <h2 id="recent-post-header">Recent posts</h2>

        <div class="posts">

            <article
                    class="post-card"
                    th:each="post : ${posts}">


                <!-- Post header -->
                <div class="post-header">

                    <div class="avatar">

                        <img
                                th:if="${users[post.userId] != null}"
                                th:src="${users[post.userId].profilePictureUrl}"
                                alt="Profile picture"/>

                    </div>


                    <div class="post-user">

                        <strong
                                th:if="${users[post.userId] != null}"
                                th:text="${users[post.userId].username}">
                        </strong>

                        <span
                                th:text="${#temporals.format(post.dateTime, 'dd/MM/yyyy HH:mm')}">
                        </span>

                    </div>

                </div>


                <!-- Post content -->
                <div class="post-content">

                    <p th:text="${post.content}"></p>

                </div>


                <!-- Post image -->
                <div
                        class="post-image"
                        th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}">

                    <img
                            th:src="${post.imageUrl}"
                            alt="Post image"/>

                </div>


                <!-- Post music -->
                <div
                        class="post-song"
                        th:if="${post.songPreviewUrl != null and !post.songPreviewUrl.isEmpty()}">

                    <img
                            th:src="${post.songImageUrl}"
                            alt="Album artwork"
                            class="post-song-image"/>

                    <div class="post-song-info">

                        <strong th:text="${post.songTitle}"></strong>

                        <span th:text="${post.songArtist}"></span>

                        <audio
                                controls
                                preload="none"
                                th:src="${post.songPreviewUrl}">
                        </audio>

                    </div>

                </div>


                <!-- Post actions -->
                <div class="post-actions">

                    <!-- Like -->
                    <form
                            th:action="@{/posts/{postId}/like(postId=${post.id})}"
                            method="post">

                        <button
                                type="submit"
                                class="post-action">

                            <span th:if="${userLikes[post.id]}">
                                Unlike
                            </span>

                            <span th:unless="${userLikes[post.id]}">
                                Like
                            </span>

                            (<span th:text="${likeCounts[post.id]}">0</span>)

                        </button>

                    </form>


                    <!-- Comment -->
                    <a
                            class="post-action"
                            id="comment-button"
                            th:href="@{/posts/{postId}/comments(postId=${post.id})}">
                        Comment
                    </a>


                    <!-- Share -->
                    <button
                            type="button"
                            class="post-action">
                        Share
                    </button>


                    <!-- Delete -->
                    <form
                            th:action="@{/posts/{postId}/delete(postId=${post.id})}"
                            method="post"
                            onsubmit="return confirm('Are you sure you want to delete this post?');">

                        <button
                                type="submit"
                                class="post-action delete-button">
                            Delete
                        </button>

                    </form>

                </div>

            </article>

        </div>

    </section>

</main>


<!-- Music search JavaScript -->
<script>

    document
        .getElementById("searchSongButton")
        .addEventListener("click", function () {

            const query =
                document.getElementById("songSearch").value.trim();

            if (!query) {
                return;
            }

            fetch("/songs/search?query=" + encodeURIComponent(query))

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Song search failed");
                    }

                    return response.json();

                })

                .then(songs => {

                    const results =
                        document.getElementById("songResults");

                    results.innerHTML = "";

                    songs.forEach(song => {

                        // Only show songs that have a preview
                        if (!song.previewUrl) {
                            return;
                        }

                        const result =
                            document.createElement("div");

                        result.className = "song-result";

                        result.innerHTML = `

                            <img
                                src="${song.artworkUrl100}"
                                alt="Album artwork">

                            <div class="song-info">

                                <strong>
                                    ${song.trackName}
                                </strong>

                                <span>
                                    ${song.artistName}
                                </span>

                            </div>

                            <button
                                type="button"
                                class="button button-secondary">
                                Add
                            </button>

                        `;


                        // Add selected song
                        result
                            .querySelector("button")
                            .addEventListener("click", function () {

                                document
                                    .getElementById("songTitle")
                                    .value = song.trackName;

                                document
                                    .getElementById("songArtist")
                                    .value = song.artistName;

                                document
                                    .getElementById("songImageUrl")
                                    .value = song.artworkUrl100;

                                document
                                    .getElementById("songPreviewUrl")
                                    .value = song.previewUrl;


                                // Display selected song
                                document
                                    .getElementById("selectedSong")
                                    .innerHTML = `

                                    <div class="selected-song">

                                        <img
                                            src="${song.artworkUrl100}"
                                            alt="Album artwork">

                                        <div>

                                            <strong>
                                                ${song.trackName}
                                            </strong>

                                            <p>
                                                ${song.artistName}
                                            </p>

                                            <audio
                                                controls
                                                preload="none"
                                                src="${song.previewUrl}">
                                            </audio>

                                        </div>

                                    </div>

                                `;


                                // Clear search results
                                results.innerHTML = "";

                            });


                        results.appendChild(result);

                    });

                })

                .catch(error => {

                    console.error(
                        "Error searching for songs:",
                        error
                    );

                });

        });


    // Clear selected song when the form is reset
    document
        .querySelector("form[enctype='multipart/form-data']")
        .addEventListener("reset", function () {

            document
                .getElementById("songTitle")
                .value = "";

            document
                .getElementById("songArtist")
                .value = "";

            document
                .getElementById("songImageUrl")
                .value = "";

            document
                .getElementById("songPreviewUrl")
                .value = "";

            document
                .getElementById("songResults")
                .innerHTML = "";

            document
                .getElementById("selectedSong")
                .innerHTML = "";

        });

</script>

</body>
</html>
