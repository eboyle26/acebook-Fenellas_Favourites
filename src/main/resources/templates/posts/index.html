<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Acebook</title>

    <link rel="stylesheet" href="/main.css"/>
</head>

<body>

<!-- Navigation bar -->
<nav class="navbar">

    <div class="navbar-content">

        <div class="logo">
            Acebook
        </div>

        <div class="navigation-links">
            <a href="/posts">Home</a>
            <a href="/profile">Profile</a>
        </div>

        <div sec:authorize="isAuthenticated()" class="user-info">
            <span>Signed in as</span>
            <strong sec:authentication="principal.attributes['email']"></strong>
        </div>

    </div>

</nav>


<!-- Main content -->
<main class="main-container">

    <h1>Posts</h1>


    <!-- Create post -->
    <section class="create-post card">

        <h2>Create a post</h2>

        <form action="#"
              th:action="@{/posts}"
              th:object="${post}"
              method="post">

            <!-- Post content -->
            <div class="form-group">

                <label for="content">
                    What's on your mind?
                </label>

                <textarea
                        id="content"
                        th:field="*{content}"
                        placeholder="Write something..."
                        required>
                </textarea>

            </div>


            <!-- Image URL -->
            <div class="form-group">

                <label for="imageUrl">
                    Add a photo
                </label>

                <input
                        type="url"
                        id="imageUrl"
                        th:field="*{imageUrl}"
                        placeholder="Paste an image URL (optional)"
                />

            </div>


            <!-- Buttons -->
            <div class="form-buttons">

                <input
                        type="reset"
                        value="Reset"
                        class="button button-secondary"/>

                <input
                        type="submit"
                        value="Post"
                        class="button button-primary"/>

            </div>

        </form>

    </section>


    <!-- Posts -->
    <section class="posts-section">

        <h2>Recent posts</h2>

        <div class="posts">

            <article class="post-card"
                     th:each="post: ${posts}">


                <!-- Post header -->
                <div class="post-header">

                    <div class="avatar">

                        <img
                                th:if="${users[post.userId] != null}"
                                th:src="${users[post.userId].profilePictureUrl}"
                                alt="Profile picture">

                    </div>


                    <div class="post-user">

                        <strong
                                th:if="${users[post.userId] != null}"
                                th:text="${users[post.userId].username}">
                        </strong>

                        <span>
                            Just now
                        </span>

                    </div>

                </div>


                <!-- Post content -->
                <div class="post-content">

                    <p th:text="${post.content}">
                    </p>

                </div>


                <!-- Post image -->
                <div
                        class="post-image"
                        th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}">

                    <img
                            th:src="${post.imageUrl}"
                            alt="Post image">

                </div>


                <!-- Post actions -->
                <div class="post-actions">

                    <button
                            type="button"
                            class="post-action">
                        Like
                    </button>

                    <a
                            class="post-action"
                            th:href="@{/posts/{postId}/comments(postId=${post.id})}">
                        Comment
                    </a>

                    <button
                            type="button"
                            class="post-action">
                        Share
                    </button>

                </div>

            </article>

        </div>

    </section>

</main>

</body>
</html>
