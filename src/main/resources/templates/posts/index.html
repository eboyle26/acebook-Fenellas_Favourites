<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Acebook</title>

    <link rel="stylesheet" href="/main.css"/>
</head>

<body>

<!-- Navigation bar -->
<nav class="navbar">

    <div class="navbar-content">

        <div class="logo">
            Acebook
        </div>

        <div class="navigation-links">

            <a href="/posts">Home</a>

            <a href="/profile">Profile</a>

        </div>

        <div sec:authorize="isAuthenticated()" class="user-info">
            <span>Signed in as</span>
            <strong sec:authentication="principal.attributes['email']"></strong>
        </div>

    </div>

</nav>


<!-- Main content -->
<main class="main-container">

    <h1>Posts</h1>

    <!-- Create post -->
    <section class="create-post card">

        <h2>Create a post</h2>

        <form action="#"
              th:action="@{/posts}"
              th:object="${post}"
              method="post">

            <div class="form-group">

                <label for="content">What's on your mind?</label>

                <textarea
                        id="content"
                        th:field="*{content}"
                        placeholder="Write something..."
                        required>
                </textarea>

            </div>

            <div class="form-buttons">

                <input
                        type="reset"
                        value="Reset"
                        class="button button-secondary"/>

                <input
                        type="submit"
                        value="Post"
                        class="button button-primary"/>

            </div>

        </form>

    </section>


    <!-- Posts -->
    <section class="posts-section">

        <h2>Recent posts</h2>

        <div class="posts">

            <article class="post-card"
                     th:each="post: ${posts}">

                <div class="post-header">

                    <div class="avatar">
                        <img th:src="${#authentication.principal.attributes['picture']}" alt="U">
                    </div>

                    <div class="post-user">
                        <strong sec:authentication="principal.attributes['email']"></strong>
                        <span>Just now</span>
                    </div>

                </div>

                <div class="post-content">
                    <p th:text="${post.content}"></p>
                </div>

                <div class="post-actions">

                    <button type="button" class="post-action">
                        Like
                    </button>

                    <button type="button" class="post-action">
                        Comment
                    </button>

                    <button type="button" class="post-action">
                        Share
                    </button>

                </div>

            </article>

        </div>

    </section>

</main>

</body>
</html>
