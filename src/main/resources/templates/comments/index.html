<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Acebook - Comments</title>

    <link rel="stylesheet" href="/main.css">


</head>

<body>

<!-- Navigation bar -->

<nav class="navbar">


    <div class="navbar-content">

        <div class="logo">
            Acebook
        </div>

        <div class="navigation-links">
            <a href="/posts">Home</a>
            <a href="/profile">Profile</a>
        </div>

    </div>

</nav>

<!-- Main content -->

<main class="main-container comments-container">


    <!-- Back to posts -->
    <a th:href="@{/posts}" class="back-link">
        ← Back to posts
    </a>


    <!-- Original post -->
    <section class="post-card comment-post">

        <div class="post-header">

            <div class="avatar">

                <img
                        th:src="${userRepository.findById(post.userId).get().profilePictureUrl}"
                        alt="Profile picture"
                >

            </div>

            <div class="post-user">

                <strong
                        th:text="${userRepository.findById(post.userId).get().username}">
                    Username
                </strong>

                <span th:text="'Original post - ' + ${#temporals.format(post.dateTime, 'dd/MM/yyyy HH:mm')}"></span>

            </div>

        </div>

        <div class="post-content">

            <p th:text="${post.content}">
                Post content
            </p>

        </div>

    </section>


    <!-- Comments -->
    <section class="comments-section">

        <div class="section-header">

            <h1>Comments</h1>

            <span th:text="${#lists.size(comments)} + ' comments'">
            0 comments
        </span>

        </div>


        <!-- No comments -->
        <div
                class="no-comments"
                th:if="${#lists.isEmpty(comments)}"
        >

            <p>
                This post has no comments yet.
            </p>

            <span>
            Be the first person to comment!
        </span>

        </div>


        <!-- Existing comments -->
        <div class="comment-list">

            <article
                    class="comment-card"
                    th:each="existingComment : ${comments}"
            >

                <!-- User's profile picture -->
                <div class="comment-avatar">

                    <img
                            th:src="${userRepository.findById(existingComment.userId).get().profilePictureUrl}"
                            alt="Profile picture"
                    >

                </div>


                <!-- Comment -->
                <div class="comment-body">

                    <div class="comment-header">

                        <strong
                                th:text="${userRepository.findById(existingComment.userId).get().username}">
                            Username
                        </strong>
<!--                        This needs styled -->
                        <span
                                th:text="${#temporals.format(existingComment.createdAt, 'dd/MM/yyyy HH:mm')}">
                        </span>

                    </div>

                    <p th:text="${existingComment.content}">
                        Comment content
                    </p>

                </div>

            </article>

        </div>

    </section>


    <!-- Add comment -->
    <section class="add-comment card">

        <h2>Leave a comment</h2>

        <form
                method="post"
                th:action="@{/posts/{postId}/comments(postId=${post.id})}"
                th:object="${comment}"
        >

            <div class="form-group">

                <label for="content">
                    What do you think?
                </label>

                <textarea
                        id="content"
                        th:field="*{content}"
                        placeholder="Write a comment..."
                        required>
            </textarea>

            </div>

            <div class="form-buttons">

                <input
                        type="reset"
                        value="Clear"
                        class="button button-secondary"
                >

                <button
                        type="submit"
                        class="button button-primary"
                >
                    Comment
                </button>

            </div>

        </form>

    </section>


</main>

</body>
</html>
