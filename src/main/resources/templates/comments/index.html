<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Acebook - Comments</title>

    <link rel="stylesheet" href="/main.css">


</head>

<body>

<!-- Navigation bar -->

<nav class="navbar">


    <div class="navbar-content">

        <div class="logo">
            Acebook
        </div>

        <div class="navigation-links">

            <a href="/posts">
                Home
            </a>

            <a href="/profile">
                Profile
            </a>

            <a href="/friends" id="friends_button">
                Friends
            </a>

            <a href="/messages">
                Messages
            </a>

            <a href="/notifications" class="notification-nav-link">
                Notifications

                <span
                        th:if="${unreadCount > 0}"
                        class="notification-dot">
            </span>

            </a>

            <div
                    sec:authorize="isAuthenticated()"
                    class="user-info"
                    id="greeting">

                <span>Signed in as</span>

                <strong
                        sec:authentication="principal.attributes['email']">
                </strong>

            </div>

            <form th:action="@{/logout}" method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Log out

                </button>

            </form>

        </div>

    </div>


</nav>


<main class="main-container comments-container">



    <a th:href="@{/posts}" class="back-link">
        ← Back to posts
    </a>


    <section class="post-card comment-post">

        <div class="post-header">

            <div class="avatar">

                <img
                        th:src="${userRepository.findById(post.userId).get().profilePictureUrl}"
                        alt="Profile picture"
                >

            </div>

            <div class="post-user">

                <strong
                        th:text="${userRepository.findById(post.userId).get().username}">
                    Username
                </strong>

                <span th:text="'Original post - ' + ${#temporals.format(post.dateTime, 'dd/MM/yyyy HH:mm')}"></span>

            </div>

        </div>

        <div class="post-content">

            <p th:text="${post.content}">
                Post content
            </p>

        </div>

    </section>

    </section>


    <section
            class="likes-summary"
            th:if="${!#lists.isEmpty(likes)}">

        <div class="likes-count">

            ❤️

            <strong
                    th:text="${#lists.size(likes)} + ' likes'">
                0 likes
            </strong>

        </div>

        <div class="liked-by">

            <span>Liked by </span>

            <span
                    th:each="like, stat : ${likes}"
                    th:text="${likeUsers[like.userId].username + (stat.last ? '' : ', ')}">
        </span>

        </div>

    </section>



    <section class="comments-section">

        <div class="section-header">

            <h1>Comments</h1>

            <span th:text="${#lists.size(comments)} + ' comments'">
            0 comments
        </span>

        </div>


        <div
                class="no-comments"
                th:if="${#lists.isEmpty(comments)}"
        >

            <p>
                This post has no comments yet.
            </p>

            <span>
            Be the first person to comment!
        </span>

        </div>


        <div class="comment-list">

            <article
                    class="comment-card"
                    th:each="existingComment : ${comments}"
            >


                <div class="comment-avatar">

                    <img
                            th:src="${userRepository.findById(existingComment.userId).get().profilePictureUrl}"
                            alt="Profile picture"
                    >

                </div>

                <div class="comment-body">

                    <div class="comment-header">

                        <strong
                                th:text="${userRepository.findById(existingComment.userId).get().username}">
                            Username
                        </strong>

                        <span
                                th:text="${#temporals.format(existingComment.createdAt, 'dd/MM/yyyy HH:mm')}">
                        </span>

                    </div>

                    <p th:text="${existingComment.content}">
                        Comment content
                    </p>

                </div>

            </article>

        </div>

    </section>

    <section class="add-comment card">

        <h2>Leave a comment</h2>

        <form
                method="post"
                th:action="@{/posts/{postId}/comments(postId=${post.id})}"
                th:object="${comment}"
        >

            <div class="form-group">

                <label for="content">
                    What do you think?
                </label>

                <textarea
                        id="content"
                        th:field="*{content}"
                        placeholder="Write a comment..."
                        required>
            </textarea>

            </div>

            <div class="form-buttons">

                <input
                        id="clear-button"
                        type="reset"
                        value="Clear"
                        class="button button-secondary"
                >

                <button
                        id="submit-comment-button"
                        type="submit"
                        class="button button-primary"
                >
                    Comment
                </button>

            </div>

        </form>

    </section>


</main>

</body>
</html>
